# firms.yaml - the list of firms the job finder checks.
#
# Each firm has:
#   name:     how it shows in jobs.md
#   tier:     1 = top priority, 2 = good
#   ats:      which job system the firm uses (workday, greenhouse, lever, ashby,
#             smartrecruiters, oracle, eightfold, phenom, icims, successfactors, manual)
#   endpoint: the address of that job system (format depends on ats, see README)
#   aliases:  (optional) other names, used to match lines in applied.txt
#   disabled: (optional) true = skip this firm
#   searches: (optional) custom search words for big sites (default: 2027, analyst program, ...)
#
# "manual" means the firm has no public job API we could find. It is still listed
# so it shows up in errors.md with a link you can check by hand.

